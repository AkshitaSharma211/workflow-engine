<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
<div class="max-w-3xl mx-auto p-6">
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold">Workflow Engine</h1>
    <div class="text-sm"><span id="who" class="mr-3 text-slate-500"></span>
      <button id="out" class="underline">Log out</button></div>
  </div>
  <p class="mt-6 text-slate-600">Jobs and runs pages come next.</p>
</div>
<script>
fetch('/me').then(r => r.json()).then(d => {
  document.getElementById('who').textContent = d.email;
});
document.getElementById('out').addEventListener('click', async () => {
  await fetch('/logout', {method: 'POST'});
  window.location = '/login';
});
</script>
</body>
</html>
