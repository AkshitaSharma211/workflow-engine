<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | Workflow Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 px-4 py-10 text-slate-900 sm:px-6">
  <main class="flex min-h-[calc(100vh-5rem)] items-center justify-center">
    <div class="w-full max-w-md">
      <div class="mb-7 flex flex-col items-center gap-3">
        <a href="/" class="flex items-center gap-2.5" aria-label="Workflow Engine home">
          <span class="flex size-9 items-center justify-center rounded-xl bg-indigo-600 text-white shadow-sm shadow-indigo-200">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="size-5">
              <path d="M5 7h14M5 12h9M5 17h6" stroke-linecap="round" />
              <circle cx="18" cy="12" r="2" fill="currentColor" stroke="none" />
            </svg>
          </span>
          <span class="text-lg font-semibold tracking-tight">Workflow Engine</span>
        </a>
      </div>

      <form id="f" class="space-y-6 rounded-xl border border-slate-200 bg-white p-6 shadow-[0_20px_45px_-24px_rgba(15,23,42,0.35)] sm:p-8">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight text-slate-950">Create your account</h1>
          <p class="mt-2 text-sm leading-6 text-slate-500">Start organizing your job search in one place.</p>
        </div>

        <div class="space-y-5">
          <div>
            <label for="email" class="mb-2 block text-sm font-medium text-slate-700">Email address</label>
            <input id="email" type="email" placeholder="you@example.com" required class="block w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">
          </div>
          <div>
            <label for="password" class="mb-2 block text-sm font-medium text-slate-700">Password</label>
            <input id="password" type="password" placeholder="Password (8+ characters)" required class="block w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">
          </div>
        </div>

        <div>
          <button class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm shadow-indigo-200 transition hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-200">Create account</button>
          <p id="msg" class="mt-3 min-h-5 text-sm text-red-600" role="alert"></p>
        </div>

        <p class="text-center text-sm text-slate-500">Have an account? <a href="/login" class="font-medium text-indigo-600 underline decoration-indigo-200 underline-offset-4 transition hover:text-indigo-700">Log in</a></p>
      </form>
    </div>
  </main>

<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const r = await fetch('/signup', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    }),
  });
  if (r.ok) { window.location = '/'; return; }
  const data = await r.json();
  document.getElementById('msg').textContent =
    typeof data.detail === 'string' ? data.detail : 'Invalid email or password format';
});
</script>
</body>
</html>

</html>
