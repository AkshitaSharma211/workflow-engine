<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
<main class="mx-auto max-w-5xl px-4 py-8 sm:px-6">
  <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Activity</h1>
  <p class="mt-1 mb-6 text-sm text-slate-500">Every run of the job-collection workflow. Click a run to see its steps.</p>
  <p id="msg" class="mb-3 text-sm text-red-600"></p>

  <div class="overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
    <table class="w-full text-left text-sm">
      <thead class="border-b border-slate-200 text-slate-500">
        <tr><th class="p-3 font-medium">Run</th><th class="font-medium">Status</th><th class="font-medium">Started</th><th class="font-medium">Duration</th></tr>
      </thead>
      <tbody id="runs"></tbody>
    </table>
  </div>

  <div id="detail" class="mt-8"></div>
</main>

<script>
const badge = {
  success: 'bg-green-50 text-green-700 ring-1 ring-green-600/20',
  failed: 'bg-red-50 text-red-700 ring-1 ring-red-600/20',
  running: 'bg-amber-50 text-amber-700 ring-1 ring-amber-600/20',
};
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when = s => new Date(s + 'Z').toLocaleString();
const dur = r => r.finished_at
  ? Math.max(0, Math.round((new Date(r.finished_at + 'Z') - new Date(r.started_at + 'Z')) / 1000)) + 's'
  : '-';
const pill = s => `<span class="rounded-full px-2.5 py-0.5 text-xs font-medium ${badge[s] || ''}">${esc(s)}</span>`;

async function loadRuns() {
  const msg = document.getElementById('msg');
  try {
    const r = await fetch('/runs?limit=20');
    if (r.status === 401) { window.location = '/login'; return; }
    if (!r.ok) throw new Error('Server returned ' + r.status);
    const runs = await r.json();
    document.getElementById('runs').innerHTML = runs.map(x => `
      <tr class="cursor-pointer border-t border-slate-100 transition hover:bg-slate-50" onclick="showRun(${x.id})">
        <td class="p-3 font-medium text-slate-900">#${x.id}</td>
        <td>${pill(x.status)}</td>
        <td class="text-slate-600">${esc(when(x.started_at))}</td>
        <td class="text-slate-600">${esc(dur(x))}</td>
      </tr>`).join('') || '<tr><td class="p-6 text-center text-slate-500" colspan="4">No runs yet.</td></tr>';
  } catch (e) { msg.textContent = 'Could not load runs: ' + e.message; }
}

async function showRun(id) {
  const detail = document.getElementById('detail');
  try {
    const r = await fetch('/runs/' + id);
    if (!r.ok) throw new Error('Server returned ' + r.status);
    const steps = await r.json();
    detail.innerHTML = `<h2 class="mb-3 font-semibold text-slate-900">Run #${id}: steps</h2>` + steps.map(s => `
      <div class="mb-3 rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
        <div class="flex items-center gap-2"><b class="text-slate-900">${esc(s.step_id)}</b>${pill(s.status)}</div>
        <details class="mt-2">
          <summary class="cursor-pointer text-xs text-indigo-600">Show raw output</summary>
          <pre class="mt-2 whitespace-pre-wrap break-all text-xs text-slate-500">${esc(String(s.output ?? '').slice(0, 300))}</pre>
        </details>
      </div>`).join('');
    detail.scrollIntoView({behavior: 'smooth'});
  } catch (e) { detail.textContent = 'Could not load steps: ' + e.message; }
}
loadRuns();
</script>
<script src="/assets/nav.js"></script>
</body>
</html>
