<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search jobs</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
<div class="max-w-4xl mx-auto p-6">
  <h1 class="text-2xl font-bold mb-4">Explore jobs</h1>

  <div class="bg-white rounded shadow p-4 mb-4 space-y-3">
    <div class="flex gap-2">
      <input id="kw" placeholder="Keyword, then press Enter" class="border rounded px-3 py-2 flex-1">
      <input id="company" placeholder="Company (optional)" class="border rounded px-3 py-2 w-48">
    </div>
    <div id="chips" class="flex flex-wrap gap-2"></div>
    <div id="filters" class="flex flex-wrap gap-2 text-sm"></div>
  </div>

  <p id="count" class="text-sm text-slate-500 mb-2"></p>
  <div id="list" class="space-y-2"></div>
  <div id="pager" class="flex justify-between items-center mt-4 text-sm"></div>
</div>

<script>
const state = {words: [], remote: false, days: 0, company: '', page: 1};
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : '#';
const on = 'bg-slate-900 text-white', off = 'bg-white border';

function renderControls() {
  document.getElementById('chips').innerHTML = state.words.map((w, i) =>
    `<span class="bg-slate-200 rounded px-2 py-1 text-sm">${esc(w)}
      <button onclick="removeWord(${i})" class="ml-1">✕</button></span>`).join('');
  const days = [[0, 'All time'], [1, '24 hours'], [7, '7 days']];
  document.getElementById('filters').innerHTML =
    `<button onclick="toggleRemote()" class="px-3 py-1 rounded ${state.remote ? on : off}">Remote only</button>` +
    days.map(([v, label]) =>
      `<button onclick="setDays(${v})" class="px-3 py-1 rounded ${state.days === v ? on : off}">${label}</button>`).join('');
}

async function load() {
  renderControls();
  const count = document.getElementById('count');
  try {
    const p = new URLSearchParams();
    if (state.words.length) p.set('q', state.words.join(' '));
    if (state.company) p.set('company', state.company);
    if (state.remote) p.set('remote', 'true');
    if (state.days) p.set('days', state.days);
    p.set('page', state.page);
    const r = await fetch('/jobs?' + p);
    if (r.status === 401) { window.location = '/login'; return; }
    if (!r.ok) throw new Error('Server returned ' + r.status);
    const d = await r.json();

    count.textContent = `${d.total} jobs`;
    document.getElementById('list').innerHTML = d.jobs.map(j => `
      <div class="bg-white rounded shadow p-4 flex justify-between gap-4">
        <div>
          <a href="${safeUrl(j.url)}" target="_blank" rel="noopener noreferrer" class="font-medium underline">${esc(j.title)}</a>
          <div class="text-sm text-slate-500">${esc(j.company)} · ${esc(j.location)}</div>
        </div>
        <div class="flex gap-1 text-xs items-start">
          ${['saved', 'applied', 'ignored'].map(s =>
            `<button onclick="mark(${j.id}, '${s}', '${j.my_status}')"
              class="px-2 py-1 rounded ${j.my_status === s ? on : off}">${s}</button>`).join('')}
        </div>
      </div>`).join('') || '<p class="text-slate-500">Nothing matches.</p>';

    const pages = Math.max(1, Math.ceil(d.total / d.per_page));
    document.getElementById('pager').innerHTML = `
      <button onclick="goPage(${state.page - 1})" ${state.page <= 1 ? 'disabled' : ''} class="px-3 py-1 border rounded bg-white disabled:opacity-40">Prev</button>
      <span>Page ${state.page} of ${pages}</span>
      <button onclick="goPage(${state.page + 1})" ${state.page >= pages ? 'disabled' : ''} class="px-3 py-1 border rounded bg-white disabled:opacity-40">Next</button>`;
  } catch (e) {
    count.textContent = 'Could not load jobs: ' + e.message;
  }
}

function toggleRemote() { state.remote = !state.remote; state.page = 1; load(); }
function setDays(v) { state.days = v; state.page = 1; load(); }
function removeWord(i) { state.words.splice(i, 1); state.page = 1; load(); }
function goPage(n) { state.page = n; load(); }

async function mark(id, status, current) {
  await fetch(`/jobs/${id}/status`, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({status: current === status ? 'none' : status}),
  });
  load();
}

document.getElementById('kw').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const w = e.target.value.trim();
  if (w && !state.words.includes(w)) { state.words.push(w); state.page = 1; load(); }
  e.target.value = '';
});
document.getElementById('company').addEventListener('change', e => {
  state.company = e.target.value.trim(); state.page = 1; load();
});
load();
</script>
<script src="/assets/nav.js"></script>
</body>
</html>
