<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Workflow Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <main class="mx-auto w-full max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
    <header class="mb-8">
      <div class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="mb-2 text-sm font-semibold uppercase tracking-wider text-indigo-600">Overview</p>
          <h1 class="text-3xl font-semibold tracking-tight text-slate-950">Dashboard</h1>
        </div>
        <p id="updated" class="text-sm text-slate-500"></p>
      </div>
    </header>

    <section aria-label="Job statistics">
      <div id="cards" class="mb-10 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-5"></div>
    </section>

    <section aria-labelledby="newest-heading" class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-[0_12px_30px_-20px_rgba(15,23,42,0.35)]">
      <div class="flex flex-col gap-3 border-b border-slate-200 px-5 py-5 sm:flex-row sm:items-center sm:justify-between sm:px-6">
        <div>
          <h2 id="newest-heading" class="text-lg font-semibold text-slate-950">Newest jobs</h2>
          <p class="mt-1 text-sm text-slate-500">Recently collected opportunities worth a look.</p>
        </div>
        <a href="/search" class="inline-flex w-fit items-center rounded-lg px-3 py-2 text-sm font-medium text-indigo-600 transition hover:bg-indigo-50 hover:text-indigo-700">Search all jobs <span aria-hidden="true" class="ml-1">→</span></a>
      </div>
      <div id="newest" class="divide-y divide-slate-100"></div>
    </section>
  </main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : '#';

function card(label, value, href) {
  return `<a href="${href}" class="group block rounded-xl border border-slate-200 bg-white p-5 shadow-[0_12px_25px_-18px_rgba(15,23,42,0.45)] transition hover:-translate-y-0.5 hover:border-indigo-200 hover:bg-indigo-50 hover:shadow-indigo-100 focus:outline-none focus:ring-4 focus:ring-indigo-100">
    <div class="text-3xl font-semibold tracking-tight text-slate-950 transition group-hover:text-indigo-700">${value}</div>
    <div class="mt-1 text-sm text-slate-500 group-hover:text-indigo-600">${label}</div></a>`;
}

async function loadStats() {
  const note = document.getElementById('updated');
  try {
    const r = await fetch('/stats');
    if (r.status === 401) { window.location = '/login'; return; }
    if (!r.ok) throw new Error('Server returned ' + r.status);
    const d = await r.json();
    note.textContent = d.last_updated
      ? 'Data last refreshed: ' + new Date(d.last_updated + 'Z').toLocaleString()
      : 'No data yet';
    document.getElementById('cards').innerHTML =
      card('Open jobs', d.open_jobs, '/search') +
      card('New in 24h', d.new_24h, '/search') +
      card('Saved', d.mine.saved, '/my-jobs#saved') +
      card('Applied', d.mine.applied, '/my-jobs#applied') +
      card('Ignored', d.mine.ignored, '/my-jobs#ignored');
    document.getElementById('newest').innerHTML = d.newest.map(j => `
      <div class="group flex flex-col gap-2 px-5 py-4 transition hover:bg-slate-50 sm:px-6">
        <a href="${safeUrl(j.url)}" target="_blank" rel="noopener noreferrer" class="w-fit font-medium text-slate-900 underline decoration-slate-300 underline-offset-4 transition group-hover:text-indigo-700 group-hover:decoration-indigo-300">${esc(j.title)}</a>
        <div class="text-sm text-slate-500">${esc(j.company)} <span aria-hidden="true" class="px-1 text-slate-300">·</span> ${esc(j.location)}</div>
      </div>`).join('') || '<div class="px-5 py-12 text-center sm:px-6"><div class="mx-auto mb-3 flex size-11 items-center justify-center rounded-full bg-indigo-50 text-indigo-600"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="size-5"><path d="M4 7.5h16M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M8 11h8M8 15h5" stroke-linecap="round"/></svg></div><p class="font-medium text-slate-900">No jobs yet</p><p class="mt-1 text-sm text-slate-500">New opportunities will appear here as they are collected.</p></div>';
  } catch (e) {
    note.textContent = 'Could not load dashboard: ' + e.message;
  }
}
loadStats();
</script>
<script src="/assets/nav.js"></script>
</body>
</html>
